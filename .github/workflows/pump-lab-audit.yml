name: Pump Lab Audit

on:
  push:
    branches:
      - pump-lab-deploy
  pull_request:
    branches:
      - pump-lab-deploy

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: node --test tests/pump-lab-runtime-guard.test.mjs
