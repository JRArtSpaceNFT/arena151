name: Collect Archived Monster Export
on:
  push:
    branches:
      - pump-lab-monster-export-temp
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Fetch archived monster export
        run: |
          ok=0
          for i in $(seq 1 50); do
            code=$(curl -sS -o archive-monster-export.json -w "%{http_code}" https://pump-lab-live.onrender.com/api/archive-monster-export || true)
            if [ "$code" = "200" ] && python3 -c 'import json; d=json.load(open("archive-monster-export.json")); assert d.get("ok") is True and "opportunities" in d' 2>/dev/null; then ok=1; break; fi
            echo "archive export not ready/valid yet: HTTP $code"
            sleep 10
          done
          test "$ok" = "1"
      - name: Analyze archived monster export
        run: python3 scripts/analyze-monster-export.py archive-monster-export.json
