name: Archive Pump Lab Season 1

on:
  push:
    branches: [pump-lab-deploy]
    paths:
      - '.github/workflows/archive-pump-lab-season1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Fetch live Season 1 core state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p archive
          curl --fail --location --retry 10 --retry-all-errors --retry-delay 3 --connect-timeout 15 --max-time 90 \
            https://pump-lab-live.onrender.com/api/state \
            -o archive/season1-state.json
          python - <<'PY'
          import json, pathlib, datetime, hashlib
          p=pathlib.Path('archive/season1-state.json')
          s=json.loads(p.read_text())
          manifest={
            'archivedAt': datetime.datetime.now(datetime.timezone.utc).isoformat(),
            'source':'https://pump-lab-live.onrender.com/api/state',
            'bytes':p.stat().st_size,
            'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),
            'trades':len(s.get('trades',[])),
            'positions':len(s.get('positions',[])),
            'version':s.get('version'),
            'season':s.get('season'),
            'strategyCount':len(s.get('strategies',[]))
          }
          pathlib.Path('archive/manifest.json').write_text(json.dumps(manifest,indent=2))
          print(json.dumps(manifest,indent=2))
          PY
      - name: Upload immutable Season 1 core artifact
        uses: actions/upload-artifact@v4
        with:
          name: pump-lab-season1-core
          path: archive/
          if-no-files-found: error
          retention-days: 90
          compression-level: 9
